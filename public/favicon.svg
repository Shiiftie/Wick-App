<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#FFD166"/>
      <stop offset="60%" stop-color="#C9921A"/>
      <stop offset="100%" stop-color="#A07412"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#0D0D0F"/>
      <stop offset="100%" stop-color="#050507"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)"/>
  <!-- Subtle gold border -->
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="13.25"
        fill="none" stroke="rgba(255,209,102,0.18)" stroke-width="1.5"/>
  <!-- Bold W in Bebas-style geometry, drawn as a path -->
  <path d="M 11 16 L 19 48 L 26 28 L 32 48 L 38 28 L 45 48 L 53 16"
        fill="none"
        stroke="url(#goldGrad)"
        stroke-width="6"
        stroke-linejoin="miter"
        stroke-linecap="square"/>
</svg>
